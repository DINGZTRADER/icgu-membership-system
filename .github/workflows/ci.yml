name: Sprint 2 Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icgu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icgu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_TIMEZONE: Africa/Kampala
      DB_CONNECTION: pgsql
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/icgu_test
      DB_SCHEMA: icgu
      DB_SSLMODE: disable
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MEMBERSHIP_DOCUMENT_DISK: local

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare PHP and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-pgsql postgresql-client
          php -v
          composer --version

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Commit dependency lockfile if absent
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if ! git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composer.lock
            git commit -m "Lock Composer dependencies"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Bootstrap private database schema
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -f database/bootstrap/supabase.sql

      - name: Lint application PHP
        run: find app bootstrap config database routes -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run fresh migrations and seed prototype data
        run: php artisan migrate:fresh --seed --force

      - name: Seed RBAC
        run: php artisan db:seed --class='Database\Seeders\RbacSeeder' --force

      - name: Verify application and Sprint 2 domain
        run: |
          php artisan icgu:health
          php artisan icgu:verify-sprint2
          php artisan route:list --path=api/membership
          php artisan route:list --path=staff/membership

      - name: Verify schema, plans and RBAC records
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.roles')" -eq 7
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.permissions')" -eq 16
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.membership_plans')" -eq 5
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select first_year_fee::int from icgu.membership_plans where code = 'individual'")" -eq 150000
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select first_year_fee::int from icgu.membership_plans where code = 'corporate'")" -eq 2000000
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.membership_applications'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.application_documents'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.organisations'

      - name: Verify audit log immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c "insert into icgu.audit_logs (action, entity, created_at, updated_at) values ('ci_check', 'CI', now(), now())"
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c "update icgu.audit_logs set action = 'tampered' where action = 'ci_check'"; then
            echo 'Audit log mutation unexpectedly succeeded.'
            exit 1
          fi
          echo 'Audit log mutation correctly blocked.'
