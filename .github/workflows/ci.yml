name: Sprint 9 Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icgu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icgu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_TIMEZONE: Africa/Kampala
      APP_URL: http://localhost
      DB_CONNECTION: pgsql
      DB_URL: postgres://postgres:postgres@127.0.0.1:5432/icgu_test
      DB_SCHEMA: icgu
      DB_SSLMODE: disable
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      MEMBERSHIP_DOCUMENT_DISK: local
      MTN_MOMO_ENABLED: false
      PRODUCTION_REQUIRE_LIVE_MAIL: false
      PILOT_IMPORT_MAX_ROWS: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare PHP and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y php-pgsql postgresql-client
          php -v
          composer --version

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate ephemeral test encryption key
        run: php artisan key:generate --force

      - name: Validate Composer manifest and lockfile
        run: composer validate --no-check-publish

      - name: Bootstrap private database schema
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -f database/bootstrap/supabase.sql

      - name: Lint application PHP
        run: find app bootstrap config database routes resources/views -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Compile Blade views
        run: |
          php artisan view:cache
          php artisan view:clear

      - name: Run fresh migrations and seed prototype data
        run: php artisan migrate:fresh --seed --force

      - name: Seed RBAC
        run: php artisan db:seed --class='Database\Seeders\RbacSeeder' --force

      - name: Verify membership lifecycle and pilot migration domains
        run: |
          php artisan icgu:health
          php artisan icgu:production-check
          php artisan icgu:verify-sprint2
          php artisan icgu:verify-sprint3
          php artisan icgu:verify-sprint4
          php artisan icgu:verify-sprint5
          php artisan icgu:verify-sprint6
          php artisan icgu:verify-sprint7
          php artisan icgu:verify-sprint8
          php artisan icgu:verify-sprint8-payment-race
          php artisan icgu:verify-sprint9
          php artisan icgu:reconcile-mobile-money --limit=1
          php artisan route:list --path=api/membership
          php artisan route:list --path=api/integrations/mtn-momo
          php artisan route:list --path=member
          php artisan route:list --path=membership/verify
          php artisan route:list --path=staff
          php artisan schedule:list
          php artisan list | grep -q 'icgu:pilot-import'
          php artisan list | grep -q 'icgu:pilot-check'

      - name: Verify Sprint 9 schema, assets and retained controls
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.roles')" -eq 7
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.permissions')" -eq 21
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c 'select count(*) from icgu.membership_plans')" -eq 5
          test -s public/css/member-portal.css
          test -s public/css/staff-admin.css
          test -s docs/PILOT_LAUNCH.md
          test -s docs/pilot-members-template.csv
          grep -q '@media(max-width:640px)' public/css/member-portal.css
          grep -q '@media(max-width:760px)' public/css/staff-admin.css
          grep -q '@media print' public/css/staff-admin.css
          grep -q 'staff.mfa' routes/web.php
          grep -q 'member.billing.mtn-momo' routes/web.php
          grep -q 'mtn-momo/callback' routes/api.php
          grep -q 'PILOT_IMPORT_MAX_ROWS' .env.example
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select renewal_fee::int from icgu.membership_plans where code = 'individual'")" -eq 100000
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select renewal_fee::int from icgu.membership_plans where code = 'student'")" -eq 50000
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select renewal_fee::int from icgu.membership_plans where code = 'ngo-corporate'")" -eq 1000000
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select renewal_fee::int from icgu.membership_plans where code = 'corporate'")" -eq 2000000
          test "$(psql -At -h 127.0.0.1 -U postgres -d icgu_test -c "select renewal_fee::int from icgu.membership_plans where code = 'sme-corporate'")" -eq 1000000
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.pilot_import_batches'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.pilot_import_rows'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.payment_requests'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.users'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c '\d icgu.audit_logs'

      - name: Verify audit log immutability
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c "insert into icgu.audit_logs (action, entity, created_at, updated_at) values ('ci_check', 'CI', now(), now())"
          if psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d icgu_test -c "update icgu.audit_logs set action = 'tampered' where action = 'ci_check'"; then
            echo 'Audit log mutation unexpectedly succeeded.'
            exit 1
          fi
          echo 'Audit log mutation correctly blocked.'
