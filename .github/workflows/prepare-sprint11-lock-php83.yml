name: Prepare Sprint 11 PHP 8.3 Composer Lock

on:
  push:
    branches: [agent/sprint-11-production-cutover]
    paths:
      - .github/workflows/prepare-sprint11-lock-php83.yml
      - composer.json

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-production-cutover

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Resolve S3 dependency for PHP 8.3
        run: composer update league/flysystem-aws-s3-v3 symfony/filesystem --with-all-dependencies --no-interaction --no-progress

      - name: Validate locked install on PHP 8.3
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already PHP 8.3 compatible"
            exit 0
          fi
          git commit -m "Lock object storage dependencies for PHP 8.3"
          git push origin HEAD:agent/sprint-11-production-cutover
