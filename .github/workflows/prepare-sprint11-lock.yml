name: Prepare Sprint 11 Composer Lock

on:
  push:
    branches: [agent/sprint-11-production-cutover]
    paths: [composer.json]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/sprint-11-production-cutover

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Resolve S3 filesystem dependency
        run: composer update league/flysystem-aws-s3-v3 --with-all-dependencies --no-interaction --no-progress

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already current"
            exit 0
          fi
          git commit -m "Lock Laravel Cloud object storage dependency"
          git push origin HEAD:agent/sprint-11-production-cutover
